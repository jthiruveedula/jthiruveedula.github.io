<!-- Static mirror of the rendered social card. The PNG at og-image.png is what
     every platform actually fetches (LinkedIn, X, Slack, WhatsApp and Facebook
     do not render SVG in link previews); this file is the editable source of
     record. The live render, with real webfonts, is og-image.source.html. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Jagadeesh Thiruveedula — Data &amp; AI Architect: 500+ TiB of enterprise data moved onto BigQuery">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#f0f2f6" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="emit" cx="0.8" cy="0.34" r="0.52">
      <stop offset="0" stop-color="#ff8c3f" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ff8c3f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8c3f" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ff8c3f" stop-opacity="0"/>
    </radialGradient>
    <style>
      .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 1.4px; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0a0d15"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#emit)"/>

  <text class="mono" x="72" y="80" font-size="15" fill="#7d8086">
    <tspan fill="#ff8c3f">00</tspan> · DATA &amp; AI ARCHITECT · DALLAS–FORT WORTH, TX
  </text>
  <text class="mono" x="1128" y="80" font-size="14" fill="#f0f2f6" text-anchor="end">JAGADEESH THIRUVEEDULA</text>
  <text class="mono" x="1128" y="104" font-size="12" fill="#7d8086" text-anchor="end">JTHIRUVEEDULA.GITHUB.IO</text>

  <text class="serif" x="70" y="212" font-size="132" fill="#f0f2f6" letter-spacing="-4">500+ TiB</text>
  <text class="serif" x="72" y="284" font-size="52" fill="#f0f2f6" letter-spacing="-1.4">of enterprise data <tspan fill="#ea6972">moved</tspan></text>
  <line x1="373" y1="292" x2="478" y2="292" stroke="#ea6972" stroke-width="2"/>
  <text class="serif" x="72" y="340" font-size="52" fill="#f0f2f6" letter-spacing="-1.4">onto BigQuery.</text>

  <!-- Topology apparatus: six sources ringing one governed plane. -->
  <g transform="translate(802,178) scale(0.75)" fill="none">
    <g stroke="#3a3d44" stroke-width="1.33">
      <line x1="200" y1="62" x2="200" y2="154"/>
      <line x1="319.5" y1="131" x2="239.8" y2="177"/>
      <line x1="319.5" y1="269" x2="239.8" y2="223"/>
      <line x1="200" y1="338" x2="200" y2="246"/>
      <line x1="80.5" y1="269" x2="160.2" y2="223"/>
      <line x1="80.5" y1="131" x2="160.2" y2="177"/>
      <polygon points="200,62 319.5,131 319.5,269 200,338 80.5,269 80.5,131" opacity="0.45"/>
    </g>
    <circle cx="200" cy="200" r="52" fill="url(#core)"/>
    <circle cx="200" cy="200" r="40" fill="#ff8c3f" fill-opacity="0.1" stroke="#ff8c3f" stroke-width="1.33"/>
    <g fill="#0b0e15" stroke="#3a3d44" stroke-width="1.33">
      <circle cx="200" cy="62" r="5.5"/><circle cx="319.5" cy="131" r="5.5"/>
      <circle cx="319.5" cy="269" r="5.5"/><circle cx="200" cy="338" r="5.5"/>
      <circle cx="80.5" cy="269" r="5.5"/><circle cx="80.5" cy="131" r="5.5"/>
    </g>
    <g class="mono" font-size="12" fill="#7d8086" stroke="none">
      <text x="200" y="36" text-anchor="middle">COBOL</text>
      <text x="345" y="123" >TERADATA</text>
      <text x="345" y="277" >KAFKA</text>
      <text x="200" y="374" text-anchor="middle">BIGQUERY</text>
      <text x="55"  y="277" text-anchor="end">VERTEX AI</text>
      <text x="55"  y="123" text-anchor="end">SNOWFLAKE</text>
      <text x="200" y="197" text-anchor="middle" fill="#ff8c3f">GOVERNED</text>
      <text x="200" y="214" text-anchor="middle">PLANE</text>
    </g>
  </g>

  <line x1="72" y1="472" x2="1128" y2="472" stroke="#26292f" stroke-width="1"/>
  <g class="serif" font-size="40" fill="#f0f2f6">
    <text x="72"  y="530">$2M+</text>
    <text x="222" y="530">1B+</text>
    <text x="386" y="530">50M+</text>
    <text x="638" y="530">11+</text>
  </g>
  <g class="mono" font-size="12.5" fill="#7d8086">
    <text x="72"  y="562">COST SAVED</text>
    <text x="222" y="562">EVENTS / DAY</text>
    <text x="386" y="562">DOCS IN PRODUCTION RAG</text>
    <text x="638" y="562">YEARS, DATA &amp; AI</text>
  </g>
  <g stroke="#26292f" stroke-width="1">
    <line x1="196" y1="494" x2="196" y2="574"/>
    <line x1="360" y1="494" x2="360" y2="574"/>
    <line x1="612" y1="494" x2="612" y2="574"/>
  </g>
</svg>
