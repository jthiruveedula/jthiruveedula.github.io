name: Deploy

# Deploys only on a published GitHub Release (a real tag, e.g. v5.0.0) — not on
# every push to master. master can carry several merged, CI-passed PRs ahead of
# what's actually live; a release is the deliberate "these merged changes go
# live now" gate. workflow_dispatch remains for a manual re-run of whatever ref
# is currently checked out (e.g. retrying a flaky Pages deploy of the same
# release) — it is not for shipping unreleased master, and rolling back to an
# OLDER release lives in rollback.yml instead: re-publishing an old GitHub
# Release doesn't fire a new release:published event, so this workflow can't
# already do that.
#
# Tests run again here, at the exact release tag, before anything deploys — PR
# CI already ran once, but a release tag can in principle be cut from any point
# on master, so this is the gate against the commit that's actually about to go
# live, not against whatever happened to pass earlier.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Verify (lint, type-check, build, E2E)
    runs-on: ubuntu-latest
    outputs:
      failed_stage: ${{ steps.record_stage.outputs.failed_stage }}
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - id: install
        name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - id: lint
        name: Lint
        run: npm run lint

      - id: typecheck
        name: Type check
        run: npx tsc --noEmit

      - id: build
        name: Build
        run: npm run build

      - id: playwright_version
        name: Get installed Playwright version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: playwright_cache
        name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright_version.outputs.version }}

      - id: install_browsers
        name: Install Playwright browsers
        # On a cache hit the browser binaries are already in place, but the runner
        # image itself is fresh every run, so the OS-level shared libraries
        # --with-deps installs via apt (not cached above) still need installing —
        # install-deps alone skips the slow, network-bound browser download while
        # still doing that apt install.
        run: |
          if [ "${{ steps.playwright_cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - id: e2e_tests
        name: E2E tests
        run: npx playwright test --project=chromium --reporter=line
        timeout-minutes: 10

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-verify-failure-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Record which stage failed (if any)
        id: record_stage
        if: always()
        run: |
          failed_stage=""
          declare -A LABELS=(
            [checkout]="Checkout"
            [setup_node]="Set up Node"
            [install]="Install dependencies"
            [lint]="Lint"
            [typecheck]="Type check"
            [build]="Build"
            [install_browsers]="Install Playwright browsers"
            [e2e_tests]="E2E tests"
          )
          declare -A OUTCOMES=(
            [checkout]="${{ steps.checkout.outcome }}"
            [setup_node]="${{ steps.setup_node.outcome }}"
            [install]="${{ steps.install.outcome }}"
            [lint]="${{ steps.lint.outcome }}"
            [typecheck]="${{ steps.typecheck.outcome }}"
            [build]="${{ steps.build.outcome }}"
            [install_browsers]="${{ steps.install_browsers.outcome }}"
            [e2e_tests]="${{ steps.e2e_tests.outcome }}"
          )
          for id in checkout setup_node install lint typecheck build install_browsers e2e_tests; do
            if [ "${OUTCOMES[$id]}" = "failure" ]; then
              failed_stage="${LABELS[$id]}"
              break
            fi
          done
          echo "failed_stage=$failed_stage" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build & deploy to GitHub Pages
    needs: [verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Post deploy summary
    needs: [verify, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post deploy summary
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG:-manual workflow_dispatch (no release tag)}"

          VERIFY_RESULT="${{ needs.verify.result }}"
          DEPLOY_RESULT="${{ needs.deploy.result }}"
          FAILED_STAGE="${{ needs.verify.outputs.failed_stage }}"
          PAGE_URL="${{ needs.deploy.outputs.page_url }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$VERIFY_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            {
              echo "### 🎉 Site is live"
              echo ""
              echo "Release **$TAG** deployed successfully."
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Release tag | \`$TAG\` |"
              echo "| Live URL | ${PAGE_URL:-https://jthiruveedula.github.io/} |"
              echo "| Tests | ✅ lint + type-check + build + e2e passed at this exact commit |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            STAGE_LABEL="${FAILED_STAGE:-deploy step}"
            if [ "$VERIFY_RESULT" != "success" ] && [ -z "$FAILED_STAGE" ]; then
              STAGE_LABEL="verify job (cancelled or infra error before a stage recorded)"
            fi
            {
              echo "### ❌ Deploy failed — site NOT updated"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Release tag | \`$TAG\` |"
              echo "| Failed stage | **$STAGE_LABEL** |"
              echo "| Verify job | $VERIFY_RESULT |"
              echo "| Deploy job | ${DEPLOY_RESULT:-skipped (verify did not succeed)} |"
              echo "| Logs | [View this run]($RUN_URL) |"
              echo ""
              echo "The previously deployed release is still live — this workflow only replaces it on a successful deploy."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
